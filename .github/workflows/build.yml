name: build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with .NET Framework csc
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenInk-win-x64
          path: release/ScreenInk.exe
